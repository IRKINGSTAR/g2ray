name: Run Xray and get config

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Xray binary
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip
          chmod +x xray

      - name: Generate config and run
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          cat > config.json <<EOF
          {
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$UUID",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "none",
                  "tcpSettings": {
                    "header": {
                      "type": "none"
                    }
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

          # اجرا در پس‌زمینه
          nohup ./xray -c config.json &
          sleep 5

          IP=$(curl -s ifconfig.me)
          PORT=8080
          echo "=============================="
          echo "VLESS Config:"
          echo "vless://$UUID@$IP:$PORT?encryption=none&flow=xtls-rprx-vision&security=none&type=tcp#XRay-GitHub-Actions"
          echo "=============================="
          echo "Service is running on $IP:$PORT"
          echo "Keep-alive for 15 minutes (you can connect now)"
          sleep 900
